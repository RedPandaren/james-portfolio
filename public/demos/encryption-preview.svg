<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" rx="32" fill="#0D0F12"/>
  <rect x="48" y="48" width="1104" height="579" rx="24" fill="#11151B" stroke="#1F2833" stroke-width="2" stroke-dasharray="6 8"/>
  <rect x="92" y="110" width="480" height="430" rx="20" fill="#121820" stroke="#1F2833" stroke-width="2"/>
  <rect x="628" y="110" width="480" height="430" rx="20" fill="#121820" stroke="#1F2833" stroke-width="2"/>
  <text x="116" y="148" fill="#7BD7FF" font-family="'Segoe UI','Inter',Arial" font-size="18" font-weight="700" letter-spacing="0.12em">ENCRYPT &amp; SIGN</text>
  <text x="652" y="148" fill="#7BD7FF" font-family="'Segoe UI','Inter',Arial" font-size="18" font-weight="700" letter-spacing="0.12em">VERIFY</text>

  <g font-family="'Segoe UI','Inter',Arial" font-size="15" fill="#DCE7F5">
    <rect x="124" y="186" width="416" height="82" rx="16" fill="#0F1821" stroke="#233041"/>
    <text x="148" y="222">payload: { amount: 1500, currency: "PHP" }</text>
    <text x="148" y="246" fill="#9FB6CF">content-digest: sha-256=54ab…19c3</text>

    <rect x="124" y="288" width="416" height="82" rx="16" fill="#0F1821" stroke="#233041"/>
    <text x="148" y="324" fill="#8EE0B3" font-weight="700">Encrypt (KMS)</text>
    <text x="148" y="348" fill="#9FB6CF">rsa-oaep + aes-gcm • key id: kms-live-pci</text>

    <rect x="124" y="390" width="416" height="82" rx="16" fill="#0F1821" stroke="#233041"/>
    <text x="148" y="426" fill="#8EE0B3" font-weight="700">Sign (HMAC)</text>
    <text x="148" y="450" fill="#9FB6CF">x-signature: hmac-sha256 over canonical request</text>
  </g>

  <g font-family="'Segoe UI','Inter',Arial" font-size="15" fill="#DCE7F5">
    <rect x="660" y="190" width="376" height="96" rx="18" fill="#0F1821" stroke="#233041" stroke-width="2"/>
    <text x="686" y="226" fill="#8EE0B3" font-weight="700" letter-spacing="0.12em">VERIFIED</text>
    <text x="686" y="252" fill="#9FB6CF">signature matches • payload intact • nonce fresh</text>

    <rect x="660" y="304" width="376" height="88" rx="18" fill="#0F1821" stroke="#233041" stroke-width="2"/>
    <text x="686" y="338" font-weight="700">DECRYPT</text>
    <text x="686" y="364" fill="#9FB6CF">kms unwrap → aes-gcm decrypt</text>

    <rect x="660" y="408" width="376" height="108" rx="18" fill="#0F1821" stroke="#233041" stroke-width="2"/>
    <text x="686" y="442" font-weight="700">TAMPER CHECK</text>
    <text x="686" y="468" fill="#9FB6CF">recompute digest = 54ab…19c3</text>
    <text x="686" y="492" fill="#9FB6CF">if mismatch → reject + alert</text>
  </g>

  <text x="96" y="90" fill="#DCE7F5" font-family="'Segoe UI','Inter',Arial" font-size="20" font-weight="700">Encryption Visualizer — Signing &amp; Integrity</text>
</svg>
