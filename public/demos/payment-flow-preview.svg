<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" rx="32" fill="#0D0F12"/>
  <rect x="48" y="48" width="1104" height="579" rx="24" fill="#11151B" stroke="#1F2833" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="96" y="96" fill="#DCE7F5" font-family="'Segoe UI','Inter',Arial" font-size="20" font-weight="700">Payment Flow Simulator — State Machine</text>

  <rect x="96" y="140" width="1008" height="140" rx="20" fill="#121820" stroke="#1F2833" stroke-width="2"/>
  <text x="124" y="186" fill="#7BD7FF" font-family="'Segoe UI','Inter',Arial" font-size="15" font-weight="700" letter-spacing="0.14em">STEPS</text>
  <line x1="160" y1="238" x2="1040" y2="238" stroke="#1F2833" stroke-width="4" stroke-linecap="round"/>
  <g fill="#8EE0B3" font-family="'Segoe UI','Inter',Arial" font-size="14" font-weight="700">
    <circle cx="220" cy="238" r="24" fill="#0F1821" stroke="#2F8066" stroke-width="2"/>
    <text x="210" y="244">1</text>
    <circle cx="460" cy="238" r="24" fill="#0F1821" stroke="#2F8066" stroke-width="2"/>
    <text x="450" y="244">2</text>
    <circle cx="700" cy="238" r="24" fill="#0F1821" stroke="#2F8066" stroke-width="2"/>
    <text x="690" y="244">3</text>
    <circle cx="940" cy="238" r="24" fill="#0F1821" stroke="#2F8066" stroke-width="2"/>
    <text x="930" y="244">4</text>
  </g>
  <g font-family="'Segoe UI','Inter',Arial" font-size="14" fill="#DCE7F5">
    <text x="188" y="278">Inquiry</text>
    <text x="416" y="278">Validation</text>
    <text x="650" y="278">Authorization</text>
    <text x="902" y="278">Payout</text>
  </g>

  <rect x="96" y="310" width="480" height="220" rx="20" fill="#121820" stroke="#1F2833" stroke-width="2"/>
  <text x="120" y="348" fill="#7BD7FF" font-family="'Segoe UI','Inter',Arial" font-size="15" font-weight="700" letter-spacing="0.14em">STATE TRANSITIONS</text>
  <g font-family="'Segoe UI','Inter',Arial" font-size="14" fill="#DCE7F5">
    <text x="120" y="382">pending → validated → authorized → settled</text>
    <text x="120" y="410" fill="#9FB6CF">guards: idempotency key, amount limit, AML flags</text>
    <text x="120" y="438">side effects: notify client, enqueue payout worker</text>
    <text x="120" y="466" fill="#9FB6CF">compat layer: legacy SOAP adapter preserved</text>
  </g>

  <rect x="612" y="310" width="492" height="220" rx="20" fill="#121820" stroke="#1F2833" stroke-width="2"/>
  <text x="636" y="348" fill="#7BD7FF" font-family="'Segoe UI','Inter',Arial" font-size="15" font-weight="700" letter-spacing="0.14em">COMPATIBILITY &amp; CONTRACTS</text>
  <g font-family="'Segoe UI','Inter',Arial" font-size="14" fill="#DCE7F5">
    <text x="636" y="382">API contract stability: 100%</text>
    <text x="636" y="406" fill="#9FB6CF">versioned payloads • adapter for legacy clients</text>
    <text x="636" y="430">idempotent POST with replay prevention</text>
    <text x="636" y="454" fill="#9FB6CF">outcomes: success | manual review | failure</text>
  </g>

  <rect x="96" y="546" width="1008" height="66" rx="14" fill="#0F1821" stroke="#1F2833" stroke-width="2"/>
  <text x="120" y="586" fill="#9FB6CF" font-family="'Segoe UI','Inter',Arial" font-size="14">Track state transitions, preserve partner contracts, and surface the exact step a remittance is in.</text>
</svg>
